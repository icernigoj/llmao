name: Release

# Publishing a GitHub release publishes the package to npm.
# Uses npm trusted publishing (OIDC): no token is stored anywhere, and npm
# adds a provenance statement linking the package to this workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      # prepublishOnly runs the full check (typecheck, tests, build, smoke)
      - run: npm publish --access public
